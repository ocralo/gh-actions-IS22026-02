name: Node.js CI

on:
 push:
   branches: [ main ]
 pull_request:
   branches: [ main ]

jobs:
 tests:
   runs-on: ubuntu-latest
   steps:
   - uses: actions/checkout@v4
   - name: Use Node.js
     uses: actions/setup-node@v4
     with:
       node-version: '24.x'
   - name: Install Dependencies
     run: npm install && echo "Dependencies installed"
   - name: Run Tests
     run: npm test && echo "Tests completed"
